                    <div id="sidebar-container" class="h-100">

                                <div class="offcanvas-header">
                                    <h5 class="offcanvas-title" id="sidebarMenuLabel" style="color:#D75656">Navigation</h5>

                                </div>

                                    <a href="orders.html" class="nav-link active py-3 px-4 text-decoration-none">
                                        <span class="icon me-2">🧾</span> Sales Orders

                                </nav>
                            </div>
                        </aside>
                    </div>
                </div>

            </div>


        </div>

        <!-- Main Content Area -->
        <main class="main-content" style="padding:0px;  overflow-x: hidden; overflow-y: hidden;">
            
            <div class="row">
                
                    <div class="col-md-8">
                        <div class="d-flex align-items-center">
                            <img src="../cropped real pic for project.png" />
                            <h1 style="margin-left:15px;">Lumina Track</h1>
                        </div>
                    </div>
                    <div class="col-md-2 mt-2">
                            <div class="avatar" style="width:200px">
                                <span id="loggedUSer"></span>
                            </div>
                    </div>
                        <div class="col-md-1" style="display:flex; gap:30px">
                        <div>
                            <button id="themeToggle" type="button" class="btn btn-light">Change Theme</button>
                        </div>
                        <div>
                            <button type="button" class="btn btn-light"><a href="codepen.html">Logout</a></button>
                        </div>
                        </div>
                    </div>      

            <div class="card mb-3" id="layout">
                 <nav aria-label="breadcrumb" style="display: flex; justify-content: space-between;">
                    <ol class="breadcrumb">
                         <a href="codepen.html" id="home_page"><li class="breadcrumb-item">Home </li></a>
                            <li class="breadcrumb-item active" aria-current="page"> 📦Inventory Management   </li>

                     </ol>
                     <div class="date-display" id="currentDate">loading date...</div>
                </nav>
                        
            </div>
    <!-- Action Bar -->
            <div class="action-bar">
                <div class="search-box" style="height: 35px; width: 300px;">
                    <span>🔍</span>

     <!-- input section -->
                    <input type="text" id="searchInput" class="search_input" placeholder="Search products by Product name " onkeyup= searchProduct()>
                </div>

     <!-- for add product button       -->
                <button class="add-btn add-only" type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal"
                data-bs-whatever = "Add a product"
                style="height: 35px;
                    padding-left: 7px;
                    padding-right: 7px;
                    padding-top: 7px;">
                    <span>+</span> Add New Product
                </button>
                <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title fs-5 " id="addModalTitle"> Add New Product</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

    <!-- here we need to add product after clicking on-->
                        <div class="modal-body">
                            <form id="form_data">
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Product Name:</label>
                                <input type="text" class="form-control" id="newProduct">
                            </div>
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Category:</label>
                                <input type="text" class="form-control" id="newCategory">
                            </div>
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Price ₹:</label>
                                <input type="text" class="form-control" id="getPrice">
                            </div>
                            <div class="mb-3">
                                <label for="recipient-name" class="col-form-label">Current Stock:</label>
                                <input type="text" class="form-control" id="availableStock">
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="button" class="btn btn-primary">Add</button>
                            </div>
                            </form>
                        </div>
                        
                    </div>
                 </div>
                </div>
            </div>

            <!-- Products Table -->
            <div class="table-section">
                <div class="table-data-scroll">
                <table class="data-table" id="product_table">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Price ₹</th>
                            <th>Current Stock</th>
                            <th>Status</th>
                            <th id="actionBar" colspan="2">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="getInventoryData">

                        <!-- Row 2 -->

                            <td>
                                Luminous 150Ah Tubular Battery

                        <!-- Row 4 -->
                        <!-- <tr>
                            <td>
                                Havells 10kW Solar PCU
                            </td>
                            <td><span class="product-category">Inverter</span></td>
                            <td>₹ 1,10,000</td>

                                <span class="action-icon edit-only">✏️</span>
                                <span class="action-icon delete-only admin-only">🗑️</span>

        <!-- //for the editting of data -->
                       <div class="modal fade" id="editProductModal" tabindex="-1">
                            <div class="modal-dialog">
                                <div class="modal-content">

                                    <div class="modal-header">
                                        <h5 class="modal-title">Edit Product Info</h5>

                                        <button type="button"
                                                class="btn-close"
                                                data-bs-dismiss="modal">
                                        </button>
                                    </div>

                                    <div class="modal-body">


                                        <div class="row">
                                            <div class="col-md-6">
                                                <label>Product Name</label>
                                                <input type="text"
                                                    id="editProduct"
                                                    class="form-control mb-3"
                                                    placeholder="Product Name">
                                            </div>        

                                            <div class="col-md-6">
                                                <label>Category</label>
                                                <input type="text"
                                                    id="editCategory"
                                                    class="form-control mb-3"
                                                    placeholder="Category">
                                            </div>        
                                        </div>    

                                        <div class="row">
                                            <div class="col-md-6">
                                                <label>Price</label>  
                                                <input type="text"
                                                    id="editPrice"
                                                    class="form-control mb-3"
                                                    placeholder="Price">
                                            </div>        

                                            <div class="col-md-6">
                                                <label>Current Stock</label>
                                                <input type="text"
                                                    id="editStocks"
                                                    class="form-control mb-3"
                                                    placeholder="Current Stock">
                                            </div>        
                                        </div>     
                                        <label>Status</label>
                                        <select class="editStatus mb-2" style="border-radius: 5px;">
                                            <option value="In Stock">In Stock</option>
                                            <option value="Low Stock">Low Stock</option>
                                            <option value="Out Of Stock">Out Of Stock</option>
                                        </select>

                                    </div>

                                    <div class="modal-footer">

                                        <button type="button"
                                                class="btn btn-secondary"
                                                data-bs-dismiss="modal">
                                            Cancel
                                        </button>

                                        <button type="submit"
                                                class="btn btn-primary"
                                                id="clickSaveChanges">
                                            Save Changes
                                        </button>

                                    </div>

                                </div>
                            </div>
                        </div>

        <!-- //for the deleting of data -->
                        <div class="modal fade" id="deleteProductModal" tabindex="-1">

                                <div class="modal-dialog">

                                    <div class="modal-content">

                                        <div class="modal-header">

                                            <h5 class="modal-title">
                                                Delete Product
                                            </h5>

                                            <button type="button"
                                                    class="btn-close"
                                                    data-bs-dismiss="modal">
                                            </button>

                                        </div>

                                        <div class="modal-body">

                                            <p>
                                                Are you sure you want to delete
                                                <strong id="deleteProduct"></strong>?
                                            </p>

                                        </div>

                                        <div class="modal-footer">

                                            <button type="button"
                                                    class="btn btn-secondary"
                                                    data-bs-dismiss="modal">
                                                Cancel
                                            </button>

                                            <button type="button"
                                                    class="btn btn-danger"
                                                    id="confirmDeleteProduct"
                                                    >
                                                Delete
                                            </button>

                                        </div>

                                    </div>

                                </div>

                            </div>
                    </tbody>
                </table>
                </div>
            </div>

        </main>
    </div>

    <script src="../JS/roles.js"></script>
    <script src="../bootstrap.bundle.min.js"></script>

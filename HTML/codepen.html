<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> LuminaTrack </title>
    <link rel="icon" type="image/x-icon" href="../real pic for project.png"/>
    <link rel = "stylesheet" href="../CSS/codepen.css"/>
   
    <link rel="stylesheet" href="../bootstrap.min.css">
    
</head>
<body>
    <div class="page">
        <div class="background-shape shape-1"></div>
        <div class="background-shape shape-2"></div>

        <div class="login-card">
            <div class="card-header">
            <h1>Welcome to LuminaTrack 😃</h1>
            <p >Sign in to continue to your dashboard</p>
            </div>

            <form class="login-form" id="loginForm">
            <div class="input-group">
                <label for="userId" >User Id <span class="mandatory">*</span></label>
                <div class="input-wrapper">
                <span class="input-icon" id="input-pen">🖍</span>
                <input
                    class="user_id"
                    type="text"
                    id="userId"
                    name="userId"
                    placeholder="Enter your User ID"
                    autocomplete="userId"
                    required
                    data-id
                />
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password <span class="mandatory">*</span></label>
                <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                />
                <button class="toggle-password" id="togglePassword" type="button" aria-label="Afficher ou masquer le mot de passe">
                    Show
                </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                <input type="checkbox" />
                <span>Remember me</span>
                </label>

                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button class="submit-btn" type="submit" >Sign In</button>
            </form>

            <div class="card-footer">
            <p>Don't have an account? <a href="codepen_signin.html">Create one</a></p>
            </div>
        </div>
    </div>

        
    <script src="../JS/session.js"></script>
    <script src="../JS/codepen.js"></script>
    <script src="../bootstrap.bundle.min.js"></script>
    <script src="../sweetalert2@11.js"></script>
    <script src="../JS/roles.js"></script>
</body>
</html>
